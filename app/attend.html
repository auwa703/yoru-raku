<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出勤・退勤｜よるラク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f4f7; --panel:#ffffff; --ink:#232228; --ink-soft:#6b6a72; --line:#e6e4de;
    --dusk:#0d1b2a; --dusk-deep:#08111c; --brass:#ff7a59; --brass-soft:#ffe8df;
    --good:#4b7a63; --good-soft:#e7f0ea; --warn:#b24444; --warn-soft:#fbe9e7;
    --radius:14px; --shadow:0 1px 3px rgba(35,34,40,.06),0 10px 28px rgba(35,34,40,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased;padding:20px;}
  .wrap{max-width:420px;margin:0 auto;}
  .brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:20px;}
  .brand-mark{width:28px;height:28px;border-radius:50%;background:conic-gradient(from -50deg, var(--brass) 0deg 110deg, var(--dusk) 110deg 360deg);-webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 6px));mask:radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 6px));}
  .brand-name{font-weight:900;font-size:15px;color:var(--dusk-deep);}
  h1{font-size:17px;font-weight:900;margin:0 0 4px;text-align:center;color:var(--dusk-deep);}
  .sub{font-size:12.5px;color:var(--ink-soft);text-align:center;margin:0 0 20px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px;}
  .staff-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .staff-name{font-weight:700;font-size:15px;}
  .btn{font-weight:700;border:none;border-radius:9px;cursor:pointer;font-size:13px;padding:9px 14px;background:linear-gradient(135deg,var(--dusk),var(--brass));color:#fff;}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .msg{text-align:center;padding:30px 10px;}
  .msg .icon{font-size:40px;margin-bottom:10px;}
  .msg.error{color:var(--warn);}
  .msg.success{color:var(--good);}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="brand-mark"></div><div class="brand-name">よるラク</div></div>
  <h1>出勤・退勤</h1>
  <p class="sub">ご自身の名前を選んで、出勤または退勤を押してください</p>
  <div id="content"><div class="msg">読み込み中...</div></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const qrPayload = params.get('payload');
const content = document.getElementById('content');

function showMessage(icon, text, cls){
  content.innerHTML = `<div class="card"><div class="msg ${cls || ''}"><div class="icon">${icon}</div><div>${text}</div></div></div>`;
}

async function loadStaffList(){
  if (!qrPayload) {
    showMessage('⚠️', 'QRコードを正しく読み取れませんでした。もう一度お店のコードを読み取ってください。', 'error');
    return;
  }
  try {
    const res = await fetch('/.netlify/functions/attendance-staff-list?qr_payload=' + encodeURIComponent(qrPayload));
    const body = await res.json();
    if (!res.ok) {
      showMessage('⏰', body.error || 'コードの有効期限が切れています。もう一度お店のQRコードを読み取ってください。', 'error');
      return;
    }
    if (!body.staff.length) {
      showMessage('👤', 'スタッフが登録されていません。管理者にご確認ください。', 'error');
      return;
    }
    content.innerHTML = `<div class="card">` + body.staff.map(s => `
      <div class="staff-row" style="padding:10px 0;border-bottom:1px solid var(--line);">
        <div class="staff-name">${escapeHtml(s.name)}</div>
        <div style="display:flex;gap:6px;">
          <button class="btn" onclick="submitAttendance('${s.id}','clock_in')">出勤</button>
          <button class="btn ghost" onclick="submitAttendance('${s.id}','clock_out')">退勤</button>
        </div>
      </div>`).join('') + `</div>`;
  } catch (err) {
    showMessage('⚠️', '通信エラーが発生しました。もう一度お試しください。', 'error');
  }
}
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
window.submitAttendance = async function(staffId, action){
  try {
    const res = await fetch('/.netlify/functions/verify-attendance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ qr_payload: qrPayload, staff_id: staffId, action }),
    });
    const body = await res.json();
    if (!res.ok) {
      showMessage('⚠️', body.error || '記録に失敗しました', 'error');
      return;
    }
    showMessage(action === 'clock_in' ? '✅' : '👋', action === 'clock_in' ? '出勤を記録しました。おつかれさまです！' : '退勤を記録しました。おつかれさまでした！', 'success');
  } catch (err) {
    showMessage('⚠️', '通信エラーが発生しました。もう一度お試しください。', 'error');
  }
};

loadStaffList();
</script>
</body>
</html>
