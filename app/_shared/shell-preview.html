<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ホーム — 店舗管理アプリ（共通シェル プレビュー）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f4f7;
    --panel:#ffffff;
    --ink:#232228;
    --ink-soft:#6b6a72;
    --line:#e6e4de;
    --dusk:#0d1b2a;       /* 開店前〜営業中を思わせる藍色。ブランドの軸色 */
    --dusk-deep:#08111c;
    --brass:#ff7a59;      /* 金額・強調用のくすんだ真鍮色 */
    --brass-soft:#ffe8df;
    --good:#4b7a63;
    --good-soft:#e7f0ea;
    --warn:#b24444;
    --warn-soft:#fbe9e7;
    --radius:14px;
    --shadow:0 1px 3px rgba(35,34,40,0.06), 0 8px 24px rgba(35,34,40,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:'Noto Sans JP',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand-name{font-family:'Noto Sans JP',sans-serif;font-weight:900;}

  /* ---------- 時間帯を示すシグネチャーバー ----------
     開店前(before) / 営業中(open) / 締め作業(closing) を
     藍色のグラデーションの位置で示す、実際の営業状態を表す帯。 */
  .status-bar{
    height:6px;width:100%;
    background:linear-gradient(90deg, var(--dusk) 0%, var(--brass) 50%, var(--dusk-deep) 100%);
    background-size:200% 100%;
  }
  .status-bar[data-phase="before"]{background-position:0% 0%;}
  .status-bar[data-phase="open"]{background-position:50% 0%;}
  .status-bar[data-phase="closing"]{background-position:100% 0%;}

  .app-shell{display:flex;min-height:100vh;}

  /* ---------- PC：サイドメニュー ---------- */
  .sidenav{
    width:220px;flex-shrink:0;background:var(--panel);
    border-right:1px solid var(--line);padding:20px 14px;
    display:flex;flex-direction:column;gap:4px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px;}
  .brand-mark{
    width:34px;height:34px;border-radius:50%;flex-shrink:0;
    background:conic-gradient(from -50deg, var(--brass) 0deg 110deg, var(--dusk) 110deg 360deg);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
  }
  .brand-name{font-size:15px;font-weight:700;color:var(--dusk-deep);}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;
    color:var(--ink-soft);text-decoration:none;font-size:14px;font-weight:500;
  }
  .nav-item .ic{width:20px;text-align:center;}
  .nav-item.active{background:linear-gradient(135deg,var(--dusk),var(--brass));color:#fff;}
  .nav-item:not(.active):hover{background:var(--bg);}

  /* ---------- メイン ---------- */
  .main{flex:1;min-width:0;padding:28px 24px 100px;max-width:880px;}
  .greet{font-size:13px;color:var(--ink-soft);margin:0 0 2px;}
  .store-name{font-size:22px;font-weight:900;margin:0 0 20px;}

  .todo-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px 18px 16px;margin-bottom:14px;
  }
  .todo-card .label{font-size:12px;color:var(--ink-soft);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .todo-card .value{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;font-family:'Montserrat',sans-serif;}
  .todo-card .value.money::before{content:'¥';font-size:16px;color:var(--brass);margin-right:2px;font-weight:700;}
  .todo-card .action{
    margin-top:12px;display:inline-flex;align-items:center;gap:6px;
    background:linear-gradient(135deg,var(--dusk),var(--brass));color:#fff;border:none;border-radius:9px;
    padding:10px 16px;font-size:13px;font-weight:700;font-family:inherit;
  }
  .todo-card.pending{border-color:var(--warn);}
  .todo-card.pending .label{color:var(--warn);}
  .todo-card.done .badge{
    display:inline-flex;align-items:center;gap:5px;background:var(--good-soft);color:var(--good);
    font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;
  }

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

  .section-title{font-size:13px;font-weight:700;color:var(--ink-soft);margin:26px 0 10px;letter-spacing:.03em;}

  /* ---------- スマホ：下部ナビ ---------- */
  .bottomnav{
    display:none;
  }

  @media (max-width:820px){
    .sidenav{display:none;}
    .main{padding:18px 14px 90px;max-width:100%;}
    .grid2{grid-template-columns:1fr 1fr;}
    .bottomnav{
      display:flex;position:fixed;left:0;right:0;bottom:0;
      background:var(--panel);border-top:1px solid var(--line);
      padding:6px 4px calc(6px + env(safe-area-inset-bottom));
      justify-content:space-around;z-index:50;
    }
    .bottomnav a{
      display:flex;flex-direction:column;align-items:center;gap:3px;
      color:var(--ink-soft);text-decoration:none;font-size:10.5px;font-weight:500;
      padding:6px 8px;border-radius:10px;min-width:56px;
    }
    .bottomnav a .ic{font-size:19px;}
    .bottomnav a.active{color:var(--dusk);font-weight:700;}
    input,select,button{font-size:16px;} /* iOSズーム防止 */
  }
</style>
</head>
<body>

<div class="status-bar" data-phase="before"></div>

<div class="app-shell">
  <!-- PC用サイドメニュー -->
  <nav class="sidenav">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-name">よるラク</div>
    </div>
    <a class="nav-item active" href="#"><span class="ic">🏠</span>ホーム</a>
    <a class="nav-item" href="#"><span class="ic">⏱</span>勤怠</a>
    <a class="nav-item" href="#"><span class="ic">🍾</span>バック・日払い</a>
    <a class="nav-item" href="#"><span class="ic">📋</span>今日の営業</a>
    <a class="nav-item" href="#"><span class="ic">💴</span>給与</a>
    <a class="nav-item" href="#"><span class="ic">📈</span>月次</a>
    <a class="nav-item" href="#"><span class="ic">❓</span>使い方・ヘルプ</a>
    <a class="nav-item" href="#"><span class="ic">⚙️</span>設定・お支払い</a>
  </nav>

  <main class="main">
    <p class="greet">おかえりなさい</p>
    <h1 class="store-name">DEMO LOUNGE さん</h1>

    <div class="todo-card pending">
      <div class="label">📋 今日の営業　まだ入力されていません</div>
      <div class="value">未入力</div>
      <button class="action">今日の営業を入力する →</button>
    </div>

    <div class="grid2">
      <div class="todo-card">
        <div class="label">本日の出勤</div>
        <div class="value">3人</div>
      </div>
      <div class="todo-card">
        <div class="label">本日の日払い</div>
        <div class="value money">10,000</div>
      </div>
      <div class="todo-card done">
        <div class="label">レジ準備金</div>
        <div class="value money">30,000</div>
      </div>
      <div class="todo-card">
        <div class="label">今月の売上（見込）</div>
        <div class="value money">1,780,000</div>
      </div>
    </div>

    <div class="section-title">今月のまとめ</div>
    <div class="grid2">
      <div class="todo-card">
        <div class="label">給与見込</div>
        <div class="value money">612,000</div>
      </div>
      <div class="todo-card">
        <div class="label">営業日数</div>
        <div class="value">18日</div>
      </div>
    </div>
  </main>
</div>

<!-- スマホ用 下部ナビ -->
<nav class="bottomnav">
  <a class="active" href="#"><span class="ic">🏠</span>ホーム</a>
  <a href="#"><span class="ic">⏱</span>勤怠</a>
  <a href="#"><span class="ic">📋</span>今日の営業</a>
  <a href="#"><span class="ic">💴</span>給与</a>
  <a href="#"><span class="ic">☰</span>メニュー</a>
</nav>

</body>
</html>
