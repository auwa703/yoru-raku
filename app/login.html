<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン｜よるラク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f4f7; --panel:#ffffff; --ink:#232228; --ink-soft:#6b6a72; --line:#e6e4de;
    --dusk:#0d1b2a; --dusk-deep:#08111c; --brass:#ff7a59; --brass-soft:#ffe8df;
    --warn:#b24444; --warn-soft:#fbe9e7;
    --radius:16px; --shadow:0 1px 3px rgba(35,34,40,.06),0 10px 28px rgba(35,34,40,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--dusk-deep);color:var(--ink);font-family:'Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:20px;}
  .status-bar{position:fixed;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--dusk),var(--brass),var(--dusk-deep));}

  .auth-wrap{width:100%;max-width:380px;}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px;}
  .brand-mark{
    width:46px;height:46px;border-radius:50%;
    background:conic-gradient(from -50deg, var(--brass) 0deg 110deg, var(--dusk) 110deg 360deg);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 9px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 9px));
  }
  .brand-name{font-size:19px;font-weight:900;color:#fff;letter-spacing:.02em;}
  .brand-tagline{font-size:11.5px;color:#9aa3b5;}

  .card{background:var(--panel);border-radius:20px;box-shadow:var(--shadow);padding:30px 26px;}
  h1{font-size:17px;font-weight:900;margin:0 0 20px;text-align:center;color:var(--dusk-deep);}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;margin-bottom:14px;}
  input:focus{outline:2px solid var(--brass);outline-offset:0;border-color:var(--brass);}
  .btn{width:100%;font-family:inherit;font-weight:700;border:none;border-radius:10px;cursor:pointer;font-size:15px;padding:13px;
    background:linear-gradient(135deg,var(--dusk),var(--brass));color:#fff;margin-top:4px;}
  .btn:hover{filter:brightness(1.05);}
  .row-between{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;margin:-4px 0 16px;}
  .row-between a{color:var(--ink-soft);text-decoration:none;}
  .row-between a:hover{color:var(--dusk);}
  .foot-link{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:20px;}
  .foot-link a{color:var(--dusk);font-weight:700;text-decoration:none;}

  .error-box{display:none;background:var(--warn-soft);border:1px solid var(--warn);color:#7a2f2f;font-size:12.5px;padding:10px 12px;border-radius:8px;margin-bottom:14px;}

  .staff-toggle{text-align:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
  .staff-toggle button{background:none;border:none;color:var(--ink-soft);font-size:12.5px;cursor:pointer;text-decoration:underline;font-family:inherit;}
</style>
</head>
<body>
<div class="status-bar"></div>

<div class="auth-wrap">
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-name">よるラク</div>
    <div class="brand-tagline">夜業態の経営をラクにする管理アプリ by ENOWA</div>
  </div>

  <div class="card">
    <h1 id="form-title">店舗管理者としてログイン</h1>

    <div class="error-box" id="error-box">メールアドレスまたはパスワードが正しくありません。</div>

    <form id="login-form">
      <div id="email-field">
        <label>メールアドレス</label>
        <input type="email" id="login-email" placeholder="you@example.com" required>
      </div>
      <div id="pin-field" style="display:none;">
        <label>ログインID</label>
        <input type="text" id="login-id" placeholder="例：a-staff">
      </div>
      <label>パスワード<span id="pin-label-suffix" style="display:none;">（PIN）</span></label>
      <input type="password" id="login-password" placeholder="••••••••" required inputmode="numeric">
      <div class="row-between">
        <label style="display:flex;align-items:center;gap:6px;margin:0;"><input type="checkbox" style="width:auto;margin:0;">ログイン状態を保持する</label>
        <a href="#">パスワードをお忘れの方</a>
      </div>
      <button type="submit" class="btn" id="submit-btn">ログイン</button>
    </form>

    <div class="staff-toggle">
      <button type="button" id="mode-toggle-btn" onclick="toggleLoginMode()">スタッフとしてログインする方はこちら</button>
    </div>
  </div>

  <p class="foot-link">まだアカウントをお持ちでない方は <a href="signup.html">新規登録（無料で試す）</a></p>
</div>

<script>
let mode = 'admin'; // 'admin' or 'staff'
function toggleLoginMode(){
  mode = mode === 'admin' ? 'staff' : 'admin';
  const isStaff = mode === 'staff';
  document.getElementById('form-title').textContent = isStaff ? 'スタッフとしてログイン' : '店舗管理者としてログイン';
  document.getElementById('email-field').style.display = isStaff ? 'none' : 'block';
  document.getElementById('pin-field').style.display = isStaff ? 'block' : 'none';
  document.getElementById('pin-label-suffix').style.display = isStaff ? 'inline' : 'none';
  document.getElementById('login-password').placeholder = isStaff ? '4桁のPIN' : '••••••••';
  document.getElementById('mode-toggle-btn').textContent = isStaff ? '店舗管理者としてログインする方はこちら' : 'スタッフとしてログインする方はこちら';
}

document.getElementById('login-form').addEventListener('submit', (e)=>{
  e.preventDefault();
  // 実装時：Supabase Auth（管理者）またはスタッフPIN照合（Netlify Functions経由）に置き換える
  document.getElementById('error-box').style.display = 'none';
  alert('この画面はデザインの確認用です。実際の認証はSupabase Auth接続後に有効になります。');
});
</script>
</body>
</html>
