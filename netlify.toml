# netlify.toml
# 自店舗版とは別のNetlifyサイトとして、このリポジトリ全体をデプロイする想定の設定。

[build]
  # marketing(LP) と app(本アプリ) を1つのサイトにまとめてデプロイする構成。
  # /app 以下は認証必須のSPA的な構成を想定し、後続の実装でルーティングを調整する。
  publish = "marketing"
  functions = "netlify/functions"
  command = "node scripts/copy-app-dirs.js"

[functions]
  node_bundler = "esbuild"

# /admin 以下を簡易Basic認証で保護する応急処置（本格的なログイン実装までの暫定措置）。
[[edge_functions]]
  path = "/admin"
  function = "admin-auth"
[[edge_functions]]
  path = "/admin/*"
  function = "admin-auth"

# デモ環境は本番と同じサイトの /demo パスで配信するが、
# 参照するデータは本番DBと完全に分離されたダミーデータのみとする（Functionsを一切呼ばない構成を推奨）。
[[redirects]]
  from = "/demo/*"
  to = "/demo/:splat"
  status = 200

# トップページ以下の静的ルーティング（LP）
[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200
[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200
[[redirects]]
  from = "/legal"
  to = "/legal.html"
  status = 200

# 認証・アプリ側の入口（/app フォルダ配下）。
# ビルドコマンドで app/ の中身を publish ディレクトリ（marketing/）へコピーして配信する。
[[redirects]]
  from = "/login"
  to = "/app/login.html"
  status = 200
[[redirects]]
  from = "/signup"
  to = "/app/signup.html"
  status = 200
[[redirects]]
  from = "/onboarding"
  to = "/app/onboarding.html"
  status = 200
[[redirects]]
  from = "/app/*"
  to = "/app/:splat"
  status = 200
[[redirects]]
  from = "/billing/success"
  to = "/app/billing-success.html"
  status = 200
[[redirects]]
  from = "/billing/cancel"
  to = "/app/billing-cancel.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# 本番公開前チェック時に参照：
#   - /app, /admin は認証必須。実装フレームワーク確定後にリダイレクト/リライトを追記する。
#   - Stripe Webhookは /.netlify/functions/stripe-webhook で受信する
