<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER_ADMIN｜よるラク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/app/_shared/supabase-client.js"></script>
<style>
  :root{
    --bg:#f2f4f7; --panel:#ffffff; --ink:#232228; --ink-soft:#6b6a72; --line:#e6e4de;
    --dusk:#0d1b2a; --dusk-deep:#08111c; --brass:#ff7a59; --brass-soft:#ffe8df;
    --good:#4b7a63; --good-soft:#e7f0ea; --warn:#b24444; --warn-soft:#fbe9e7;
    --radius:14px; --shadow:0 1px 3px rgba(35,34,40,.06),0 8px 24px rgba(35,34,40,.05);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased;}
  .status-bar{height:5px;width:100%;background:linear-gradient(90deg,var(--warn),var(--dusk-deep));}
  header{background:var(--dusk-deep);color:#fff;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:15px;}
  .brand-mark{width:26px;height:26px;border-radius:50%;background:conic-gradient(from -50deg, var(--brass) 0deg 110deg, var(--dusk) 110deg 360deg);
    -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));
    mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 5px));}
  .admin-badge{background:var(--warn);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;}
  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px 60px;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
  @media(max-width:760px){.stat-grid{grid-template-columns:1fr 1fr;}}
  .stat-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
  .stat-card .k{font-size:11.5px;color:var(--ink-soft);}
  .stat-card .v{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
  .toolbar input,.toolbar select{padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:inherit;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px;overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px;}
  th{text-align:left;font-weight:700;color:var(--ink-soft);border-bottom:1px solid var(--line);padding:8px 10px;font-size:11.5px;}
  td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
  .badge.active{background:var(--good-soft);color:var(--good);}
  .badge.trialing{background:var(--brass-soft);color:#8a611f;}
  .badge.past_due{background:var(--warn-soft);color:var(--warn);}
  .badge.canceled{background:#eee;color:var(--ink-soft);}
  select.plan-select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;}
  .icon-btn{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;text-decoration:underline;}
  .icon-btn:hover{color:var(--warn);}
  .btn{font-weight:700;border:none;border-radius:9px;cursor:pointer;font-size:13px;padding:9px 15px;background:linear-gradient(135deg,var(--dusk),var(--brass));color:#fff;font-family:inherit;}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
  .btn.sm{padding:7px 12px;font-size:12.5px;}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(8,17,28,.5);z-index:100;align-items:center;justify-content:center;padding:20px;}
  .modal{background:var(--panel);border-radius:var(--radius);max-width:560px;width:100%;max-height:86vh;overflow-y:auto;padding:22px;}
  .modal h2{margin:0 0 4px;font-size:17px;}
  .modal .modal-sub{margin:0 0 18px;font-size:12.5px;color:var(--ink-soft);}
  .modal h3{font-size:13.5px;margin:20px 0 10px;color:var(--ink-soft);}
  .flag-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .flag-row:last-child{border-bottom:none;}
  .switch{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .slider{position:absolute;inset:0;background:#dcdad4;border-radius:22px;transition:.15s;cursor:pointer;}
  .switch .slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
  .switch input:checked + .slider{background:var(--brass);}
  .switch input:checked + .slider::before{transform:translateX(16px);}
  .custom-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .custom-row .lbl{flex:1;}
  .custom-row .lbl .key{display:block;font-size:11px;color:var(--ink-soft);}
  .custom-add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .custom-add input{flex:1;min-width:140px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;}
  .modal-close{position:absolute;top:16px;right:18px;background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;}
  .modal-wrap{position:relative;}
</style>
</head>
<body>
<div class="status-bar"></div>
<header>
  <div class="brand"><div class="brand-mark"></div>よるラク <span class="admin-badge">SUPER_ADMIN</span></div>
  <div style="display:flex;align-items:center;gap:14px;">
    <span style="font-size:12.5px;color:#9aa3b5;">運営者専用ページ — 一般の店舗アカウントからはアクセスできません</span>
    <button class="icon-btn" style="color:#9aa3b5;" onclick="sb.auth.signOut().then(()=>location.href='/admin/login.html')">ログアウト</button>
  </div>
</header>

<div class="wrap">
  <div class="stat-grid" id="stat-grid"></div>

  <div class="toolbar">
    <input type="text" id="search-input" placeholder="🔍 店舗名で検索" oninput="renderTable()">
    <select id="status-filter" onchange="renderTable()">
      <option value="all">契約状態：すべて</option>
      <option value="trialing">無料体験中</option>
      <option value="active">契約中</option>
      <option value="past_due">支払い遅延</option>
      <option value="canceled">解約済</option>
    </select>
  </div>

  <div class="card">
    <table>
      <thead><tr>
        <th>店舗名</th><th>登録日</th><th>契約プラン</th><th>契約状態</th><th>スタッフ人数</th><th></th>
      </tr></thead>
      <tbody id="store-table-body"></tbody>
    </table>
  </div>
</div>

<div class="modal-overlay" id="store-settings-overlay">
  <div class="modal modal-wrap">
    <button class="modal-close" onclick="closeStoreSettings()">×</button>
    <h2 id="settings-store-name"></h2>
    <p class="modal-sub">この店舗だけに適用される詳細設定です。運営者(SUPER_ADMIN)のみ変更できます。</p>

    <h3>機能のON/OFF</h3>
    <div id="settings-flag-list"></div>

    <h3>カスタム設定項目</h3>
    <p class="modal-sub" style="margin:-6px 0 10px;">この店舗専用の設定を自由に追加できます（コード変更なしで項目を増やせます）。</p>
    <div id="settings-custom-list"></div>
    <div class="custom-add">
      <input type="text" id="new-custom-label" placeholder="項目名（例：給与前払いを許可）">
      <button class="btn ghost sm" onclick="addCustomSetting()">＋ 追加</button>
    </div>
  </div>
</div>

<script>
// store_daily_settings に対応する機能フラグ一覧（表示名とキー）。
// 実装時はSupabaseの store_daily_settings テーブルと1:1で対応する。
const DAILY_SETTING_FLAGS = [
  {key:'use_sales', label:'売上入力'},
  {key:'use_sales_by_payment', label:'売上を支払方法別に入力'},
  {key:'use_visitor_groups', label:'組数を記録'},
  {key:'use_visitor_count', label:'人数を記録'},
  {key:'use_staff_display', label:'出勤スタッフの表示'},
  {key:'use_daily_pay', label:'日払い機能'},
  {key:'use_expenses', label:'経費記録'},
  {key:'use_purchases', label:'仕入記録'},
  {key:'use_other_income', label:'その他入金記録'},
  {key:'use_other_outcome', label:'その他出金記録'},
  {key:'use_notes', label:'申し送りメモ'},
  {key:'use_cash_count', label:'金種カウント'},
  {key:'use_cash_closing', label:'レジ締め（現金過不足チェック）'},
];
function defaultDailySettings(){
  const s = {};
  DAILY_SETTING_FLAGS.forEach(f => s[f.key] = true);
  return s;
}

let stores = [];
let currentUserId = null;

async function adminApi(action, body){
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch('/.netlify/functions/admin-api?action=' + action, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + session.access_token },
    body: JSON.stringify({ action, ...body }),
  });
  const responseBody = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(responseBody.error || 'リクエストに失敗しました');
  return responseBody;
}

async function boot(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/admin/login.html'; return; }
  currentUserId = session.user.id;
  try {
    const { stores: list } = await adminApi('list_stores', {});
    stores = list;
  } catch (err) {
    if (err.message === '管理者権限がありません') {
      alert('このアカウントには管理者権限がありません。');
      await sb.auth.signOut();
    }
    window.location.href = '/admin/login.html';
    return;
  }
  renderStats();
  renderTable();
}

const planLabel = {light:'LIGHT', standard:'STANDARD', pro:'PRO'};
const statusLabel = {trialing:'無料体験中', active:'契約中', past_due:'支払い遅延', canceled:'解約済'};

let currentSettingsStoreId = null;

window.openStoreSettings = async function(id){
  currentSettingsStoreId = id;
  const s = stores.find(x=>x.id===id);
  document.getElementById('settings-store-name').textContent = `${s.name} の詳細設定`;
  const detail = await adminApi('get_store_detail', { store_id: id });
  s.dailySettings = Object.keys(detail.dailySettings).length ? detail.dailySettings : defaultDailySettings();
  s.customSettings = detail.customSettings.map(c => ({ id: c.id, key: c.key, label: c.label, enabled: c.value_boolean }));
  renderFlagList();
  renderCustomList();
  document.getElementById('store-settings-overlay').style.display = 'flex';
};
window.closeStoreSettings = function(){
  document.getElementById('store-settings-overlay').style.display = 'none';
  currentSettingsStoreId = null;
};

function renderFlagList(){
  const s = stores.find(x=>x.id===currentSettingsStoreId);
  document.getElementById('settings-flag-list').innerHTML = DAILY_SETTING_FLAGS.map(f => `
    <div class="flag-row">
      <span>${f.label}</span>
      <label class="switch">
        <input type="checkbox" ${s.dailySettings[f.key] ? 'checked' : ''} onchange="toggleDailySetting('${f.key}', this.checked)">
        <span class="slider"></span>
      </label>
    </div>`).join('');
}
window.toggleDailySetting = async function(key, checked){
  const s = stores.find(x=>x.id===currentSettingsStoreId);
  s.dailySettings[key] = checked;
  await adminApi('update_daily_settings', { store_id: currentSettingsStoreId, settings: s.dailySettings });
  showToast(`「${DAILY_SETTING_FLAGS.find(f=>f.key===key).label}」を${checked ? '有効' : '無効'}にしました`);
};

function renderCustomList(){
  const s = stores.find(x=>x.id===currentSettingsStoreId);
  const wrap = document.getElementById('settings-custom-list');
  if(!s.customSettings.length){
    wrap.innerHTML = `<p class="modal-sub" style="margin:4px 0;">まだカスタム項目はありません。</p>`;
    return;
  }
  wrap.innerHTML = s.customSettings.map(c => `
    <div class="custom-row">
      <div class="lbl">${c.label}<span class="key">${c.key}</span></div>
      <label class="switch">
        <input type="checkbox" ${c.enabled ? 'checked' : ''} onchange="toggleCustomSetting('${c.key}', this.checked)">
        <span class="slider"></span>
      </label>
      <button class="icon-btn" onclick="removeCustomSetting('${c.id}')">削除</button>
    </div>`).join('');
}
window.toggleCustomSetting = async function(key, checked){
  const s = stores.find(x=>x.id===currentSettingsStoreId);
  const c = s.customSettings.find(c=>c.key===key);
  c.enabled = checked;
  await adminApi('upsert_custom_setting', { store_id: currentSettingsStoreId, key: c.key, label: c.label, value_boolean: checked });
};
window.removeCustomSetting = async function(id){
  const s = stores.find(x=>x.id===currentSettingsStoreId);
  if(!confirm('この項目を削除しますか？')) return;
  await adminApi('delete_custom_setting', { id });
  s.customSettings = s.customSettings.filter(c=>c.id!==id);
  renderCustomList();
};
window.addCustomSetting = async function(){
  const input = document.getElementById('new-custom-label');
  const label = input.value.trim();
  if(!label){ alert('項目名を入力してください'); return; }
  const s = stores.find(x=>x.id===currentSettingsStoreId);
  const key = 'custom_' + label
    .replace(/[^\p{L}\p{N}]+/gu, '_')
    .replace(/^_+|_+$/g, '')
    .toLowerCase() || ('custom_' + Date.now().toString(36));
  if(s.customSettings.some(c=>c.key===key)){ alert('同じ名前の項目がすでにあります'); return; }
  await adminApi('upsert_custom_setting', { store_id: currentSettingsStoreId, key, label, value_boolean: true });
  const detail = await adminApi('get_store_detail', { store_id: currentSettingsStoreId });
  s.customSettings = detail.customSettings.map(c => ({ id: c.id, key: c.key, label: c.label, enabled: c.value_boolean }));
  input.value = '';
  renderCustomList();
  showToast(`「${label}」を追加しました`);
};

function renderStats(){
  const total = stores.length;
  const activeCount = stores.filter(s=>s.status==='active').length;
  const trialCount = stores.filter(s=>s.status==='trialing').length;
  const pastDueCount = stores.filter(s=>s.status==='past_due').length;
  document.getElementById('stat-grid').innerHTML = `
    <div class="stat-card"><div class="k">登録店舗数</div><div class="v">${total}</div></div>
    <div class="stat-card"><div class="k">契約中</div><div class="v" style="color:var(--good);">${activeCount}</div></div>
    <div class="stat-card"><div class="k">無料体験中</div><div class="v" style="color:#8a611f;">${trialCount}</div></div>
    <div class="stat-card"><div class="k">支払い遅延</div><div class="v" style="color:var(--warn);">${pastDueCount}</div></div>
  `;
}

function renderTable(){
  const search = document.getElementById('search-input').value.trim().toLowerCase();
  const statusFilter = document.getElementById('status-filter').value;
  let list = stores.filter(s=>{
    const searchOk = !search || s.name.toLowerCase().includes(search);
    const statusOk = statusFilter==='all' || s.status===statusFilter;
    return searchOk && statusOk;
  });
  document.getElementById('store-table-body').innerHTML = list.map(s=>`
    <tr>
      <td>${s.name}${s.isMonitor ? '<span class="badge trialing" style="margin-left:6px;">モニター</span>' : ''}</td>
      <td>${s.registeredAt}</td>
      <td>
        <select class="plan-select" onchange="updatePlan('${s.id}', this.value)">
          <option value="" ${!s.plan?'selected':''}>未設定</option>
          ${Object.keys(planLabel).map(p=>`<option value="${p}" ${p===s.plan?'selected':''}>${planLabel[p]}</option>`).join('')}
        </select>
      </td>
      <td><span class="badge ${s.status}">${statusLabel[s.status] || s.status}</span></td>
      <td>${s.staffCount}人</td>
      <td style="white-space:nowrap;">
        <button class="icon-btn" onclick="openStoreSettings('${s.id}')">詳細設定</button>
        ${s.status!=='canceled'
          ? `<button class="icon-btn" style="margin-left:10px;" onclick="suspendStore('${s.id}')">利用停止にする</button>`
          : `<button class="icon-btn" style="margin-left:10px;" onclick="reactivateStore('${s.id}')">再開する</button>`}
      </td>
    </tr>`).join('');
}

window.updatePlan = async function(id, plan){
  const s = stores.find(x=>x.id===id);
  await adminApi('update_plan', { store_id: id, plan_id: plan || null });
  s.plan = plan || null;
  showToast(`${s.name} のプランを ${plan ? planLabel[plan] : '未設定'} に変更しました`);
};
window.suspendStore = async function(id){
  const s = stores.find(x=>x.id===id);
  if(!confirm(`${s.name} を利用停止にしますか？`)) return;
  await adminApi('suspend_store', { store_id: id });
  s.status = 'canceled';
  renderStats(); renderTable();
  showToast(`${s.name} を利用停止にしました`);
};
window.reactivateStore = async function(id){
  const s = stores.find(x=>x.id===id);
  await adminApi('reactivate_store', { store_id: id });
  s.status = 'active';
  renderStats(); renderTable();
  showToast(`${s.name} の利用を再開しました`);
};

function showToast(msg){
  let el = document.getElementById('admin-toast');
  if(!el){
    el = document.createElement('div');
    el.id = 'admin-toast';
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dusk-deep);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:200;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window._adminToastTimer);
  window._adminToastTimer = setTimeout(()=>{ el.style.display='none'; }, 2400);
}

boot();
</script>
</body>
</html>
