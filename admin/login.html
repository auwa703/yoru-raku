<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPER_ADMINログイン｜よるラク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/app/_shared/supabase-client.js"></script>
<style>
  :root{
    --bg:#f2f4f7; --panel:#ffffff; --ink:#232228; --ink-soft:#6b6a72; --line:#e6e4de;
    --dusk:#0d1b2a; --dusk-deep:#08111c; --brass:#ff7a59; --warn:#b24444; --warn-soft:#fbe9e7;
    --radius:16px; --shadow:0 1px 3px rgba(35,34,40,.06),0 10px 28px rgba(35,34,40,.06);
  }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--dusk-deep);color:var(--ink);font-family:'Noto Sans JP',sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-wrap{width:100%;max-width:380px;}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px;}
  .brand-mark{width:46px;height:46px;border-radius:50%;background:conic-gradient(from -50deg, var(--brass) 0deg 110deg, var(--dusk) 110deg 360deg);-webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 9px));mask:radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 9px));}
  .brand-name{font-size:19px;font-weight:900;color:#fff;}
  .admin-badge{background:var(--warn);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-top:6px;display:inline-block;}
  .card{background:var(--panel);border-radius:20px;box-shadow:var(--shadow);padding:30px 26px;}
  h1{font-size:16px;font-weight:900;margin:0 0 20px;text-align:center;color:var(--dusk-deep);}
  label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;margin-bottom:14px;}
  .btn{width:100%;font-family:inherit;font-weight:700;border:none;border-radius:10px;cursor:pointer;font-size:15px;padding:13px;background:linear-gradient(135deg,var(--dusk),var(--brass));color:#fff;}
  .error-box{display:none;background:var(--warn-soft);border:1px solid var(--warn);color:#7a2f2f;font-size:12.5px;padding:10px 12px;border-radius:8px;margin-bottom:14px;}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="brand" style="text-align:center;">
    <div class="brand-mark"></div>
    <div class="brand-name">よるラク</div>
    <span class="admin-badge">SUPER_ADMIN</span>
  </div>
  <div class="card">
    <h1>運営者ログイン</h1>
    <div class="error-box" id="error-box"></div>
    <form id="admin-login-form">
      <label>メールアドレス</label>
      <input type="email" id="admin-email" required>
      <label>パスワード</label>
      <input type="password" id="admin-password" required>
      <button type="submit" class="btn">ログイン</button>
    </form>
  </div>
</div>
<script>
document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorBox = document.getElementById('error-box');
  errorBox.style.display = 'none';
  const email = document.getElementById('admin-email').value.trim();
  const password = document.getElementById('admin-password').value;

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    errorBox.textContent = 'メールアドレスまたはパスワードが正しくありません。';
    errorBox.style.display = 'block';
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  const res = await fetch('/.netlify/functions/admin-api?action=list_stores', {
    headers: { Authorization: 'Bearer ' + session.access_token },
  });
  if (res.status === 403) {
    errorBox.textContent = 'このアカウントには管理者権限がありません。';
    errorBox.style.display = 'block';
    await sb.auth.signOut();
    return;
  }
  window.location.href = '/admin/index.html';
});
</script>
</body>
</html>
